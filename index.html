<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIBLIOTECA — Colección de Personajes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400;1,6..96,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ PALETA Y TIPOGRAFÍA ============ */
:root{
  --negro:#0e0a0a; --rojo:#c1121f; --rojo-osc:#5c080e; --hueso:#eee8dd; --gris:#2b2222;
  --didone:'Bodoni Moda','Playfair Display',Georgia,serif;   /* títulos y números gigantes */
  --pesada:'Archivo Black','Arial Black',sans-serif;          /* rótulos tipo "TRACK LIST" */
  --sans:'Inter','Helvetica Neue',Arial,sans-serif;           /* textos técnicos pequeños */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--negro);color:var(--hueso);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--rojo);outline-offset:3px}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(14px,3vw,36px)}

/* ============ PORTADA + CONTRAPORTADA (2 páginas enfrentadas) ============ */
.portada{display:grid;grid-template-columns:1fr 1fr;margin-top:clamp(14px,3vw,36px);min-height:clamp(380px,52vw,620px)}
.p-izq{background:var(--rojo);color:var(--hueso);padding:clamp(18px,3vw,36px);display:flex;flex-direction:column;justify-content:space-between}
.p-izq h1{font-family:var(--didone);font-weight:400;text-transform:uppercase;line-height:.9;letter-spacing:-.02em;
  font-size:clamp(2.4rem,7.2vw,6.6rem);word-break:keep-all}
.ficha{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.p-der{background:var(--hueso);color:var(--negro);padding:clamp(18px,3vw,36px);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.p-der .sub{font-family:var(--didone);font-style:italic;color:var(--rojo);font-size:clamp(2rem,5.4vw,4.6rem);line-height:1}
.p-der .n-gigante{font-family:var(--didone);color:var(--rojo);font-size:clamp(9rem,24vw,20rem);line-height:.72;margin:auto 0 -.06em -.04em;opacity:.95}
.barras{height:44px;width:150px;align-self:flex-end;background:repeating-linear-gradient(90deg,var(--negro) 0 2px,transparent 2px 4px,var(--negro) 4px 5px,transparent 5px 8px,var(--negro) 8px 11px,transparent 11px 12px)}

/* ============ ARCHIVO: BUSCADOR + FILTROS ============ */
.archivo{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,60px);padding:clamp(40px,7vw,90px) 0 clamp(24px,4vw,44px);align-items:end}
.archivo h2{font-family:var(--pesada);font-weight:400;font-size:clamp(2.6rem,8vw,6.5rem);line-height:.88;text-transform:uppercase;letter-spacing:-.01em}
.archivo h2 span{display:block;color:var(--rojo)}
.buscar label{display:block;font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--rojo);font-weight:600;margin-bottom:4px}
#buscador{width:100%;background:none;border:0;border-bottom:1px solid var(--hueso);border-radius:0;outline:0;color:var(--hueso);
  font-family:var(--didone);font-style:italic;font-size:clamp(1.3rem,3vw,2rem);padding:6px 0}
#buscador::placeholder{color:#7d746a;opacity:1}
#buscador:focus{border-bottom-color:var(--rojo)}
.filtros{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 0}
.filtros button{background:none;border:0;cursor:pointer;color:var(--hueso);font:500 .7rem var(--sans);letter-spacing:.22em;text-transform:uppercase;padding:2px 14px 2px 0;margin-right:14px;position:relative}
.filtros button+button::before{content:"/";position:absolute;left:-15px;color:var(--rojo)}
.filtros button:hover{color:var(--rojo)}
.filtros button.activo{color:var(--rojo);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.contador{margin-top:16px;font-family:var(--didone);font-style:italic;color:#9d9488;font-size:.95rem}

/* ============ DOBLES PÁGINAS (cada personaje) ============ */
.indice{padding-bottom:clamp(50px,8vw,100px)}
.spread{display:grid;grid-template-columns:1fr 1fr;position:relative;margin-top:clamp(24px,4vw,48px);box-shadow:0 30px 60px -30px #000}
.spread::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:56px;transform:translateX(-50%);pointer-events:none;z-index:3;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.38) 50%,transparent)}
.spread:nth-child(even) .lado-foto{order:2}
.lado-foto{position:relative;overflow:hidden;background:var(--rojo-osc);aspect-ratio:4/5}
.lado-foto img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05) contrast(1.05);transition:filter .5s,transform .9s}
.spread:hover .lado-foto img{filter:brightness(1.14) saturate(1.1);transform:scale(1.03)}
.inicial{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--didone);font-style:italic;color:var(--rojo);
  font-size:clamp(10rem,26vw,22rem);background:repeating-linear-gradient(135deg,#180708 0 16px,#230a0c 16px 32px)}
.lado-texto{background:var(--negro);padding:clamp(18px,3vw,38px);display:flex;flex-direction:column;overflow:hidden;position:relative;border:1px solid var(--gris)}
.spread:nth-child(even) .lado-texto{background:var(--hueso);color:var(--negro);border-color:var(--hueso)}
.pag{font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:#a89f92;display:flex;justify-content:space-between}
.spread:nth-child(even) .pag{color:#6b6459}
.lado-texto h3{font-family:var(--didone);font-style:italic;font-weight:400;color:var(--rojo);font-size:clamp(2rem,4.4vw,3.8rem);line-height:1;margin:clamp(14px,2vw,26px) 0 clamp(14px,2vw,24px)}
.bloque{margin-bottom:16px;max-width:46ch}
.etq{font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;font-weight:600;color:var(--rojo);margin-bottom:3px}
.bloque p{font-size:.92rem}
.caption{font-family:var(--didone);font-style:italic;font-size:1.08rem;line-height:1.5}
.enlaces{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.enlaces a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.enlaces a:hover{color:var(--rojo)}
.enlaces .sep{margin:0 .8em;color:var(--rojo)}
.numero{margin:auto 0 -.1em -.03em;font-family:var(--didone);font-weight:400;color:var(--rojo);font-size:clamp(7rem,16vw,14rem);line-height:.72;user-select:none;transition:transform .6s}
.spread:hover .numero{transform:translateY(-.06em)}
.vacio{padding:70px 0;text-align:center;font-family:var(--didone);font-style:italic;font-size:1.5rem;color:#9d9488}

/* ============ CONTRAPORTADA FINAL ============ */
footer{background:var(--rojo);color:var(--hueso);padding:clamp(40px,7vw,90px) 0 28px}
footer .fila{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap}
footer .marca{font-family:var(--didone);font-size:clamp(2.6rem,10vw,8rem);line-height:.9;text-transform:uppercase}
footer .barras{background:repeating-linear-gradient(90deg,var(--hueso) 0 2px,transparent 2px 4px,var(--hueso) 4px 5px,transparent 5px 8px,var(--hueso) 8px 11px,transparent 11px 12px)}
footer .creditos{margin-top:34px;padding-top:16px;border-top:1px solid rgba(238,232,221,.5);font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;line-height:2;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ============ RESPONSIVE ============ */
@media(max-width:820px){
  .archivo{grid-template-columns:1fr}
  .spread{grid-template-columns:1fr}
  .spread::after{display:none}
  .spread:nth-child(even) .lado-foto{order:0}
  .lado-texto{min-height:340px}
}
@media(max-width:560px){
  .portada{grid-template-columns:1fr}
  .p-izq{min-height:300px}
  .p-izq h1{font-size:clamp(2.6rem,15vw,5rem)}
  .p-der{min-height:320px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ============ PORTADA ============ -->
<header class="wrap">
  <div class="portada">
    <div class="p-izq">
      <div class="ficha"><span id="fecha"></span><span id="precio"></span></div>
      <h1 id="titulo">Biblioteca</h1>
      <div class="ficha"><span id="sub-izq"></span><span id="sub-der"></span></div>
    </div>
    <div class="p-der">
      <div class="sub">Colección<br>de Personajes</div>
      <div class="n-gigante" aria-hidden="true" id="n-gigante">001</div>
      <div class="barras" aria-hidden="true"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- ============ ARCHIVO: BUSCADOR + FILTROS ============ -->
  <section class="archivo">
    <h2>Índice<span>del archivo</span></h2>
    <div class="buscar">
      <label for="buscador">Búsqueda en el archivo</label>
      <input id="buscador" type="search" placeholder="Nombre, descripción o sección…" autocomplete="off">
      <nav class="filtros" id="filtros" aria-label="Filtrar por sección"></nav>
      <p class="contador" id="contador"></p>
    </div>
  </section>

  <!-- ============ DOBLES PÁGINAS ============ -->
  <section class="indice" id="indice" aria-live="polite"></section>
</main>

<!-- ============ CONTRAPORTADA ============ -->
<footer>
  <div class="wrap">
    <div class="fila">
      <div class="marca" id="marca-footer">Biblioteca</div>
      <div class="barras" aria-hidden="true"></div>
    </div>
    <div class="creditos">
      <span>Dirección editorial: Tu Nombre</span>
      <span>Imágenes: sus respectivos creadores</span>
      <span>© <span id="anio"></span> — Derechos de sus autores</span>
    </div>
  </div>
</footer>

<script>
/* =====================================================================
   ⬇️ AQUÍ EDITAS TUS PERSONAJES ⬇️
   Copia y pega un bloque { ... }, — deja "" en lo que no uses.
   · imagen: URL o ruta (ej. "img/luna.jpg"). Vacío = se muestra la inicial.
   · enlaces: los vacíos ("") no aparecen. "otro" puede ser cualquier URL.
   ===================================================================== */

// Ajustes de la revista (falsos, cámbialos a tu gusto)
const REVISTA = {
  titulo:  "Biblioteca",
  edicion: "N.º 001",
  fecha:   "Septiembre 2026",
  precio:  "Edición de colección",
  numeroSubtitulo: "Edición N.º 001",
  creditosAnio: 2026
};

const PERSONAJES = [
  {
    nombre: "Isabella Marchetti",
    imagen: "",
    descripcion: "Heredera de una casa veneciana con un secreto guardado bajo tres llaves.",
    etiquetas: ["Fantasía", "Romance"],
    enlaces: { drive: "https://drive.google.com/", janitor: "https://janitorai.com/", caveduck: "", chub: "", poe: "", otro: "" }
  },
  {
    nombre: "Kaito Arashi",
    imagen: "",
    descripcion: "Espadachín errante que colecciona atardeceres y deudas de honor.",
    etiquetas: ["Aventura", "Drama"],
    enlaces: { drive: "", janitor: "https://janitorai.com/", caveduck: "https://caveduck.io/", chub: "https://chub.ai/", poe: "", otro: "" }
  },
  {
    nombre: "Lady Ophelia Crane",
    imagen: "",
    descripcion: "Detective victoriana, impecable en el vestir y despiadada en el interrogatorio.",
    etiquetas: ["Misterio", "Época"],
    enlaces: { drive: "https://drive.google.com/", janitor: "", caveduck: "", chub: "", poe: "https://poe.com/", otro: "https://ejemplo.com" }
  },
  {
    nombre: "Zephyr",
    imagen: "",
    descripcion: "Androide de compañía que aprendió a soñar y ahora no quiere despertar.",
    etiquetas: ["Ciencia ficción", "Drama"],
    enlaces: { drive: "", janitor: "https://janitorai.com/", caveduck: "", chub: "", poe: "", otro: "" }
  }
];

/* =====================================================================
   ⬆️ FIN DE LA ZONA EDITABLE — no hace falta tocar nada más abajo ⬆️
   ===================================================================== */

/* Nombres visibles de cada tipo de enlace */
const NOMBRES_ENLACE = { drive:"Drive", janitor:"Janitor", caveduck:"CaveDuck", chub:"Chub", poe:"Poe", otro:"Otro" };

/* Estado de la interfaz */
let filtroActivo = "Todos";
let textoBusqueda = "";

const $indice = document.getElementById("indice");
const $filtros = document.getElementById("filtros");
const $contador = document.getElementById("contador");

/* Escapa HTML para evitar inyecciones desde los datos */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Solo permite enlaces http(s) */
const urlSegura = u => /^https?:\/\//i.test(String(u || "").trim());
/* Quita tildes y mayúsculas para buscar con comodidad */
const normalizar = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const dos = n => String(n).padStart(2, "0");

/* Rellena portada y contraportada con los ajustes de REVISTA */
function pintarPortada(){
  document.title = REVISTA.titulo.toUpperCase() + " — Colección de Personajes";
  document.getElementById("titulo").textContent = REVISTA.titulo;
  document.getElementById("marca-footer").textContent = REVISTA.titulo;
  document.getElementById("fecha").textContent = REVISTA.fecha;
  document.getElementById("precio").textContent = REVISTA.precio;
  document.getElementById("sub-izq").textContent = REVISTA.numeroSubtitulo;
  document.getElementById("sub-der").textContent = PERSONAJES.length + " retratos";
  document.getElementById("n-gigante").textContent = (REVISTA.edicion.match(/\d+/) || ["001"])[0];
  document.getElementById("anio").textContent = REVISTA.creditosAnio;
}

/* Lista única de etiquetas (secciones) */
function obtenerEtiquetas(){
  const set = new Set();
  PERSONAJES.forEach(p => (p.etiquetas || []).forEach(e => set.add(e)));
  return ["Todos", ...[...set].sort((a, b) => a.localeCompare(b, "es"))];
}

function pintarFiltros(){
  $filtros.innerHTML = obtenerEtiquetas().map(e =>
    `<button type="button" data-tag="${esc(e)}" class="${e === filtroActivo ? "activo" : ""}">${esc(e)}</button>`).join("");
}

/* Foto: imagen o inicial editorial */
function htmlFoto(p){
  const c = p.imagen
    ? `<img src="${esc(p.imagen)}" alt="${esc(p.nombre)}" loading="lazy">`
    : `<div class="inicial" aria-hidden="true">${esc((p.nombre || "?").trim().charAt(0).toUpperCase())}</div>`;
  return `<div class="lado-foto">${c}</div>`;
}

/* Enlaces: omite los vacíos */
function htmlEnlaces(p){
  const items = Object.entries(p.enlaces || {})
    .filter(([, url]) => urlSegura(url))
    .map(([k, url]) => `<a href="${esc(url.trim())}" target="_blank" rel="noopener noreferrer">${esc(NOMBRES_ENLACE[k] || k)}</a>`);
  return items.length
    ? `<div class="bloque"><div class="etq">Leer en</div><div class="enlaces">${items.join('<span class="sep">·</span>')}</div></div>` : "";
}

/* Dibuja las dobles páginas según búsqueda y filtro */
function pintarIndice(){
  const q = normalizar(textoBusqueda.trim());
  const visibles = PERSONAJES.map((p, i) => ({ p, i })).filter(({ p }) => {
    const okTag = filtroActivo === "Todos" || (p.etiquetas || []).includes(filtroActivo);
    const texto = normalizar([p.nombre, p.descripcion, ...(p.etiquetas || [])].join(" "));
    return okTag && (!q || texto.includes(q));
  });

  $contador.textContent = visibles.length === 1 ? "1 retrato encontrado" : visibles.length + " retratos encontrados";

  if (!visibles.length){
    $indice.innerHTML = `<p class="vacio">Nada coincide. Prueba con otra palabra o elige «Todos».</p>`;
    return;
  }

  $indice.innerHTML = visibles.map(({ p, i }) => `
    <article class="spread">
      ${htmlFoto(p)}
      <div class="lado-texto">
        <div class="pag"><span>Pág. ${dos(i * 2 + 1)}–${dos(i * 2 + 2)}</span></div>
        <h3>${esc(p.nombre)}</h3>
        <div class="bloque"><div class="etq">Secciones</div><p>${(p.etiquetas || []).map(esc).join(" / ")}</p></div>
        <div class="bloque"><div class="etq">Nota editorial</div><p class="caption">${esc(p.descripcion)}</p></div>
        ${htmlEnlaces(p)}
        <div class="numero" aria-hidden="true">${dos(i + 1)}</div>
      </div>
    </article>`).join("");
}

/* Eventos */
document.getElementById("buscador").addEventListener("input", e => { textoBusqueda = e.target.value; pintarIndice(); });
$filtros.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filtroActivo = b.dataset.tag; pintarFiltros(); pintarIndice();
});

/* Inicio */
pintarPortada(); pintarFiltros(); pintarIndice();
</script>
</body>
</html>
